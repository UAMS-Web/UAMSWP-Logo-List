name: CI

# The checks this plugin runs on every pull request and on pushes to main.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job. One definition serves every UAMS-Web repository, so this plugin does not
# carry a copy that drifts. The call switches on the two jobs only a plugin runs
# (`floor-lint`, `download-archive`), runs on Linux only, leaves mutation testing off, and
# runs the plugin's unit suite as `composer test:unit`. `phpcs` stays off: this plugin has no
# PHPCS configuration. The chain's own header lists every input and its default.
#
# `guard` and `lint` stay here as plain jobs beside the call, because the chain has no job
# for either: a tracked secret or personal-data file, and `php -l` over every PHP file
# (tests included) on the development PHP.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call and the plain jobs, runs `if: always()`, and fails unless every needed job reports
# `success`: a `skipped` or `cancelled` job fails it. The call ends in a `Chain result` job
# that needs every job in the chain, so `checks` is `success` only when each of them
# succeeded. Adding a plain job here means adding it to the `needs:` list of `CI`; the
# `aggregate-needs` job in the chain fails the pull request when one is missing. Do not
# rename `CI`, and do not rename `checks` without changing `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, the Composer
# scripts `test:pint`, `test:refactor`, `stan` and `test:unit`, and `scripts/lint-floor.php`.
#
# The local CI runner (.claude/skills/local-ci/) runs the same checks from `local-ci.json`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.9.0
    with:
      linux-only: true
      mutate: true
      mutate-paths: templates
      mutate-ignore-paths: templates
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  guard:
    name: Guard against committed secrets or personal data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on a tracked secret or personal-data file
        run: |
          bad=$(git ls-files | grep -E "sentinel-key\.php$|wp-config\.php$|\.sql(\.gz)?$|\.(csv|tsv|xlsx?)$|\.env(\.|$)|\.pem$|\.key$" || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret/PII file(s) detected:"; echo "$bad"; exit 1
          fi

  lint:
    name: PHP lint (development PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: php -l every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path './tests/Integration/vendor/*' -not -path './node_modules/*' -not -path './tests-legacy/*' -print0 \
            | xargs -0 -I{} php -l "{}"

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and
  # every plain job above.
  ci:
    name: CI
    needs: [checks, guard, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
